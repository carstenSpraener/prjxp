plugins {
    id 'java'
    id 'jacoco'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'de.spraener.prjxp'
version = '0.8.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()   // prjxp-common is resolved from the local Maven repository
    mavenCentral()
}

dependencies {
    // compileOnly (NOT implementation): the host provides prjxp-common at runtime,
    // so it must NOT be bundled into the plugin JAR. Re-added for tests below.
    compileOnly 'de.spraener.prjxp:prjxp-common:0.8.1-SNAPSHOT'

    testImplementation 'de.spraener.prjxp:prjxp-common:0.8.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    dependsOn shadowJar
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

shadowJar {
    archiveBaseName.set('lp-gdscript')
    archiveClassifier.set('plugin')
    archiveVersion.set('')
    zip64 = true
    // The host API and logging are provided by the host (parent-first delegation);
    // a bundled copy would break class identity and the plugin is rejected at load.
    exclude 'de/spraener/prjxp/common/**'
    exclude 'org/slf4j/**'
    mergeServiceFiles()
}
