plugins {
    id 'org.springframework.boot' version '3.5.0' apply false
    id 'java-test-fixtures'
}

// JaCoCo Coverage-Ratchets pro Modul (LINE COVEREDRATIO).
// Die Werte liegen bewusst unter dem aktuellen Stand (gemessen in DockerHub Phase 02):
//   prjxp-common: 92.3% · chunk-norris: 71.7% · tibed: 57.5%
//   golden-retriever: 40.6% · lucene-store: 79.0% · docpipe: 94.8% · mcp-server: 87.6%
// Nur nach oben rücken, wenn Legacy-Code getestet wurde — nie senken.
def coverageRatchets = [
        'prjxp-common'     : 0.85,
        'chunk-norris'     : 0.70,
        'tibed'            : 0.55,
        'golden-retriever' : 0.35,
        'lucene-store'     : 0.75,
        'docpipe'          : 0.80,   // >80% LOC-Ziel erreicht (gemessen 94.8%)
        'mcp-server'       : 0.80,  // strikt: hier landet der DockerHub-Code
        'mcp-proxy'        : 0.80   // stdio -> streamable-http Bridge, kein Spring
]

subprojects {
    apply plugin: 'java-test-fixtures'
    apply plugin: 'jacoco'

    group = 'de.spraener.prjxp'
    version = '0.8.0-rc1'

    apply plugin: 'java'

    // Preserve parameter names for Spring MVC @PathVariable/@RequestParam reflection
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-parameters']
    }

    repositories {
        mavenCentral()
    }

    // Security-Pins auch für ausschließlich transitive Abhängigkeiten durchsetzen.
    // Dies verhindert, dass Shadow-JARs eine vulnerable Version einbetten.
    def jacksonVersion = libs.versions.jackson.get()
    def jlineVersion = libs.versions.jline.get()
    configurations.configureEach {
        resolutionStrategy.force(
                "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}",
                "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}",
                "org.jline:jline-builtins:${jlineVersion}",
                "org.jline:jline-reader:${jlineVersion}"
        )
    }

    // Zentrale Konfiguration für DevTools (wie besprochen)
    configurations {
        developmentOnly
        runtimeClasspath.extendsFrom developmentOnly
    }

    // mcp-proxy ist ein reines Plain-Java Modul (kein Spring Boot, kein Webserver)
    def isMcpProxy = project.name == 'mcp-proxy'

    dependencies {
        if (!isMcpProxy) {
            // Spring Boot Starter aus dem Version Catalog
            implementation libs.spring.boot.starter
            implementation libs.spring.boot.starter.validation

            // Security-Pins (SecurityFindings.csv): log4j/logback werden transitiv via starter-logging gezogen
            implementation libs.log4j.api
            implementation libs.log4j.to.slf4j
            implementation libs.logback.core
            implementation libs.logback.classic

            developmentOnly libs.spring.boot.devtools
        } else {
            // mcp-proxy: Logback direkt (ohne Spring-Boot-Starter-Logging)
            implementation libs.logback.core
            implementation libs.logback.classic
        }

        // Lombok (Katalog) — auch fuer mcp-proxy
        compileOnly libs.lombok
        annotationProcessor libs.lombok
        testCompileOnly libs.lombok
        testAnnotationProcessor libs.lombok

        // Testing (Nutzt das Bundle)
        if (!isMcpProxy) {
            testImplementation libs.bundles.test.bundle
        } else {
            // mcp-proxy: Mockito + AssertJ + JUnit 5 ohne Spring-Boot-Starter-Test
            testImplementation libs.mockito.core
            testImplementation libs.mockito.junit.jupiter
            testImplementation libs.assertj.core
            testImplementation libs.junit5.api
            testRuntimeOnly  libs.junit5.engine
        }
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
        jvmArgs("-Djava.awt.headless=false")
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
            csv.required = false
        }
    }

    jacocoTestCoverageVerification {
        dependsOn test
        violationRules {
            rule {
                limit {
                    counter = 'LINE'
                    value = 'COVEREDRATIO'
                    minimum = coverageRatchets[project.name] ?: 0.80
                }
            }
        }
    }

    check {
        dependsOn jacocoTestCoverageVerification
    }
}

// ---------------------------------------------------------------------------
// C# Language Pack E2E (WP-2 Phase 04): build the standalone lp-csharp plugin.
// lp-csharp is a SEPARATE Gradle build (not in settings.gradle) that consumes
// prjxp-common from mavenLocal, so it is driven via an Exec task. Shared by
// mcp-server and chunk-norris, whose E2E tests load the staged JAR via
// prjxp.language-packs.dir.
// ---------------------------------------------------------------------------
def lpCsharpDir = new File(rootDir, 'lp-csharp')
def lpCsharpJar = new File(lpCsharpDir, 'build/libs/lp-csharp-plugin.jar')

tasks.register('buildLpCsharpPlugin', Exec) {
    dependsOn ':prjxp-common:publishToMavenLocal'
    workingDir = lpCsharpDir
    commandLine './gradlew', 'shadowJar', '--console=plain'
    // Rebuild when the plugin sources, its build scripts, or the host API it
    // compiles against change (the inner build is up-to-date-checked itself).
    inputs.dir(new File(lpCsharpDir, 'src'))
    inputs.file(new File(lpCsharpDir, 'build.gradle'))
    inputs.file(new File(lpCsharpDir, 'settings.gradle'))
    inputs.dir(new File(rootDir, 'prjxp-common/src'))
    outputs.file(lpCsharpJar)
}