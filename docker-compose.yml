services:
  mcp-server:
    image: prjxp
    build: .
    ports:
      - "7007:7007"
    volumes:
      # Mount project directory for application.yaml, .env, and source code
      - ./:/app-source
      # Persistent Lucene index storage
      - prjxp-data:.prjxp-data/lucene-index
    environment:
      EMBEDDING_STORE_TYPE: lucene
      EMBEDDING_MODEL_TYPE: onnx_local
      LUCENE_INDEX_PATH: .prjxp-data/lucene-index
      LUCENE_VECTOR_DIMENSION: "1024"
      PRJXP_ROOT_DIR: /app-source
      SERVER_PORT: "7007"

volumes:
  prjxp-data:
