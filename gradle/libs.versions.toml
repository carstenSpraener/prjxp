[versions]
# Core Frameworks
springBoot = "3.5.13"
langchain4j = "1.13.0"
langchain4j-beta = "1.13.0-beta23"
langchain4j-http = "1.13.1"   # langchain4j-http-client-jdk
shadow = "8.3.0"
springAi = "1.1.8"
# Security-Pins (SecurityFindings.csv / Grype-Scan der Shadow-JARs)
jackson = "2.21.7"       # GHSA: PolymorphicTypeValidator-Bypass, DoS (zuvor 2.21.x via langchain4j/Starter-POMs)
log4j = "2.25.5"         # GHSA-qv9r: MapMessage JSON-Encoding (zuvor 2.24.x via Spring Boot)
logback = "1.5.34"       # GHSA: Objekt-Injection/Deserialisierung (zuvor 1.5.32 via Spring Boot)
jline = "3.30.15"        # GHSA-r2xf: ReDoS in grep-Command (zuvor 3.30.9 via Groovy/MCP-SDK)
mcpSdk = "1.1.4"         # GHSA-8jxr: DNS-Rebinding, Fix erst in 1.0.0 (zuvor 0.18.x via Spring AI)
mcpSdkLegacy = "0.18.4"  # letztes 0.x-Release: mcp-spring-webmvc existiert nur bis 0.18.x, und Spring AI referenziert das alte Binding-Package (in 1.x umbenannt) — OSV-clean
javafx = "21.0.5"

# Libraries
commonsCli = "1.11.0"
javaparser = "3.25.10"
dotenv = "3.0.0"
commonsIo = "2.21.0"
commonsCompress = "1.27.1"
lombok = "1.18.34"
groovy = "5.0.5"
opennlp = "2.5.12"   # pinned: langchain4j pulls 2.5.4 transitively (CVE-2026-42027/-40682/-42440)
handlebars = "4.5.1"

lucene = "9.12.0"

# Test
mockito = "5.11.0"
assertj = "3.27.7"
[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }

[libraries]
# Spring Boot
spring-boot-starter = { group = "org.springframework.boot", name = "spring-boot-starter", version.ref = "springBoot" }
spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web", version.ref = "springBoot" }
spring-boot-starter-json = { group = "org.springframework.boot", name = "spring-boot-starter-json", version.ref = "springBoot" }
spring-boot-devtools = { group = "org.springframework.boot", name = "spring-boot-devtools", version.ref = "springBoot" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test", version.ref = "springBoot" }
spring-boot-openapi-starter-webmvc-ui = { group = "org.springdoc", name = "springdoc-openapi-starter-webmvc-ui", version = "2.6.0" }
spring-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation", version.ref = "springBoot" }
spring-ai-mcp-server = { group = "org.springframework.ai", name = "spring-ai-starter-mcp-server-webmvc", version.ref = "springAi" }

# Security-Pins (SecurityFindings.csv / Grype-Scan der Shadow-JARs)
jackson-core = { group = "com.fasterxml.jackson.core", name = "jackson-core", version.ref = "jackson" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
log4j-api = { group = "org.apache.logging.log4j", name = "log4j-api", version.ref = "log4j" }
log4j-to-slf4j = { group = "org.apache.logging.log4j", name = "log4j-to-slf4j", version.ref = "log4j" }
logback-core = { group = "ch.qos.logback", name = "logback-core", version.ref = "logback" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
jline-reader = { group = "org.jline", name = "jline-reader", version.ref = "jline" }
jline-builtins = { group = "org.jline", name = "jline-builtins", version.ref = "jline" }
mcp-core = { group = "io.modelcontextprotocol.sdk", name = "mcp-core", version.ref = "mcpSdk" }
mcp-json-jackson2 = { group = "io.modelcontextprotocol.sdk", name = "mcp-json-jackson2", version.ref = "mcpSdkLegacy" }
mcp-spring-webmvc = { group = "io.modelcontextprotocol.sdk", name = "mcp-spring-webmvc", version.ref = "mcpSdkLegacy" }

# Langchain4j
langchain4j-core   = { group = "dev.langchain4j", name = "langchain4j-core", version.ref = "langchain4j" }
langchain4j-ollama = { group = "dev.langchain4j", name = "langchain4j-ollama", version.ref = "langchain4j" }
langchain4j-openai = { group = "dev.langchain4j", name = "langchain4j-open-ai", version.ref = "langchain4j" }
langchain4j-tika-docparser = { group = "dev.langchain4j", name = "langchain4j-document-parser-apache-tika", version.ref = "langchain4j-beta" }
langchain4j-pdf-docparser = { group = "dev.langchain4j", name = "langchain4j-document-parser-apache-pdfbox", version.ref = "langchain4j-beta"}
langchain4j-mcp = { group = "dev.langchain4j", name = "langchain4j-mcp", version.ref = "langchain4j-beta"}

langchain4j-google-ai-gemini = { group = "dev.langchain4j", name = "langchain4j-google-ai-gemini", version.ref = "langchain4j" }
langchain4j-community = { group = "dev.langchain4j", name = "langchain4j", version.ref = "langchain4j" }
langchain4j-http-client-jdk = { group = "dev.langchain4j", name = "langchain4j-http-client-jdk", version.ref = "langchain4j-http" }

# Version pin for langchain4j's transitive OpenNLP dependency (CVE-2026-42027, CVE-2026-40682, CVE-2026-42440)
opennlp-tools = { group = "org.apache.opennlp", name = "opennlp-tools", version.ref = "opennlp" }

# Utilities
commons-cli = { group = "commons-cli", name = "commons-cli", version.ref = "commonsCli" }
javaparser-core = { group = "com.github.javaparser", name = "javaparser-core", version.ref = "javaparser" }
dotenv-java = { group = "io.github.cdimascio", name = "dotenv-java", version.ref = "dotenv" }
commons-io = { group = "commons-io", name = "commons-io", version.ref = "commonsIo" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
jgrapht = { group = "org.jgrapht", name="jgrapht-core", version="1.5.3"}
lucene-core = { group = "org.apache.lucene", name = "lucene-core", version.ref = "lucene" }
handlebars = { group = "com.github.jknack", name = "handlebars", version.ref = "handlebars" }

# Document conversion libraries
pdfbox = {group = "org.apache.pdfbox", name="pdfbox", version="3.0.7"}
xdocreport = {group="fr.opensagres.xdocreport", name="fr.opensagres.poi.xwpf.converter.xhtml", version="2.2.0"}
flexmark = {group="com.vladsch.flexmark", name="flexmark-html2md-converter", version="0.64.8"}
jsoup = {group="org.jsoup", name="jsoup", version="1.23.2"} # Security-Pin: Tika zieht 1.21.x transitiv (GHSA: XmlTreeBuilder-OOM, Cleaner)

# Annotation Processors
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }

# Embedded Scripting
groovy = { group = "org.apache.groovy", name = "groovy-all", version.ref = "groovy"}

# Testing
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito" }
assertj-core = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }

[bundles]
# Ein Bundle für die Lombok-Konfiguration (spart Zeilen im Build-Script)
lombok = ["lombok"]
conversion=["pdfbox", "xdocreport", "flexmark", "jsoup"]

# Standard Testing Stack
test-bundle = ["mockito-core", "mockito-junit-jupiter", "spring-boot-starter-test", "assertj-core"]
# Ein Bundle für LangChain4j spart Platz im Build-Script
# opennlp-tools: Version-Pin, da langchain4j 2.5.4 transitiv zieht (Security-CVEs)
# jackson-core/databind: Version-Pin, da langchain4j/Starter 2.21.x ziehen (Security-CVEs)
langchain-stack = ["langchain4j-core", "langchain4j-ollama", "langchain4j-google-ai-gemini", "langchain4j-openai", "langchain4j-mcp", "opennlp-tools", "jackson-core", "jackson-databind"]
# jsoup: Version-Pin, da Tika 1.21.x transitiv zieht (Security-CVEs)
langchain-docparser = ["langchain4j-tika-docparser", "langchain4j-pdf-docparser", "jsoup"]

spring-ai = ["spring-ai-mcp-server"]