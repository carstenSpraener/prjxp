/*
 * lp-csharp — C# Language Pack plugin for prjxp (WP-2).
 *
 * Standalone build: consumes prjxp-common from the local Maven repository and
 * bundles a C# parser generated from the MIT-licensed ANTLR grammar
 * (dotnet/roslyn, CSharp.Generated.g4). See README.md for the license and the
 * generation steps.
 */
plugins {
    id 'java'
    // Fat-JAR (plugin) packaging: bundles the plugin classes + ANTLR, but not the
    // host API (prjxp-common) or logging (slf4j) — the host provides those.
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'de.spraener.prjxp'
version = '0.8.1-SNAPSHOT'

java {
    toolchain {
        // Match the host runtime (eclipse-temurin:21).
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    // prjxp-common is resolved from the local Maven repository first, so the
    // plugin builds against the locally published artifact (not a composite).
    mavenLocal()
    mavenCentral()
}

// The ANTLR tool (parser generator) is isolated in its own configuration so it
// does not leak onto the compile/runtime classpath.
configurations {
    antlrTool
}

def antlrVersion = '4.13.1'

dependencies {
    // The shared host API (LanguagePack, LanguagePackProvider, PxChunker,
    // PxChunk, GoldenRetriever, ...). Pinned to the locally published version.
    //
    // compileOnly (NOT implementation): the host provides prjxp-common at runtime,
    // so it must NOT be bundled into the plugin JAR. compileOnly keeps it off the
    // runtime classpath (and thus out of the shadow JAR) while still letting the
    // plugin compile against it. It is re-added for the test source set below.
    compileOnly 'de.spraener.prjxp:prjxp-common:0.8.1-SNAPSHOT'

    // ANTLR: the tool (build-time generation) and the runtime (compile + run).
    // The runtime is the plugin's private dependency and IS bundled into the JAR.
    antlrTool "org.antlr:antlr4:${antlrVersion}"
    implementation "org.antlr:antlr4-runtime:${antlrVersion}"

    // Testing: the host API is needed on the test compile + runtime classpath.
    testImplementation 'de.spraener.prjxp:prjxp-common:0.8.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------------
// ANTLR grammar generation
//
// The C# grammar is a single COMBINED grammar (CSharp.g4, derived from the
// Roslyn compiler grammar): one ANTLR invocation generates both the lexer and
// the parser. String literals in parser rules resolve against the grammar's
// own lexer rules (contextual keywords such as `record` or `union` resolve to
// identifier_token).
// ---------------------------------------------------------------------------
def antlrPackage = 'de.spraener.prjxp.lpcsharp.grammar'
def antlrSourceDir = file("src/main/antlr/${antlrPackage.replace('.', '/')}")
def antlrOutputDir = file("build/generated-src/antlr/main")

tasks.register('generateCSharpGrammar', JavaExec) {
    group = 'generation'
    description = 'Generates the C# lexer and parser from the Roslyn ANTLR grammar.'
    classpath = configurations.antlrTool
    mainClass = 'org.antlr.v4.Tool'
    inputs.dir antlrSourceDir
    outputs.dir antlrOutputDir
    // Delete the output dir before generating so stale files from a previous
    // grammar (e.g. the old separated CSharpParser.g4) cannot linger and break
    // compilation with dangling references to removed context classes.
    doFirst {
        delete antlrOutputDir
    }
    args = [
            '-o', antlrOutputDir.absolutePath,
            '-package', antlrPackage,
            '-visitor',
            "${antlrSourceDir}/CSharp.g4",
    ]
}

sourceSets {
    main {
        java {
            srcDir antlrOutputDir
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'generateCSharpGrammar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    // PluginJarTest inspects the fat-JAR, so it must be built first.
    dependsOn shadowJar
}

// ---------------------------------------------------------------------------
// Plugin fat-JAR
//
// The deliverable is a self-contained plugin JAR that the host drops into
// ./language-packs. It bundles the plugin's own classes and its private ANTLR
// runtime, plus the SPI service file. It must NOT bundle the host API
// (de.spraener.prjxp.common.** — provided by the host, see compileOnly above)
// or logging (org.slf4j.** — provided by the host).
// ---------------------------------------------------------------------------
shadowJar {
    archiveBaseName.set('lp-csharp')
    archiveClassifier.set('plugin')
    archiveVersion.set('')
    zip64 = true

    // Belt-and-suspenders: prjxp-common is already off the runtime classpath
    // (compileOnly), but exclude the host API and logging explicitly so a future
    // dependency change cannot leak them into the plugin JAR.
    exclude 'de/spraener/prjxp/common/**'
    exclude 'org/slf4j/**'

    // Merge META-INF/services so the LanguagePackProvider SPI entry survives.
    mergeServiceFiles()
}
