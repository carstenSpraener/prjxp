<VirtualHost *:80>
    ServerName localhost

    # App (Angular) — nginx serves the app under /prjxp/
    ProxyPreserveHost On
    ProxyPass /prjxp http://frontend:8080/prjxp
    ProxyPassReverse /prjxp http://frontend:8080/prjxp

    # API — via frontend nginx to the hub backend
    ProxyPass /api http://frontend:8080/api
    ProxyPassReverse /api http://frontend:8080/api

    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Require all granted
    </Directory>
</VirtualHost>
