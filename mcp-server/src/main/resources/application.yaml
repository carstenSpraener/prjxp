mcp:
  cors:
    allowed-patterns: "http://10.*.*.*,http://172.16.*.*,http://192.168.*.*,http://localhost:*"

spring:
  servlet:
    multipart:
      # Upload-Limit für Hub-Endpunkte (Archive/JSONL); Docker-Image legt 2GB darüber
      max-file-size: ${PRJXP_MAX_UPLOAD_SIZE:100MB}
      max-request-size: ${PRJXP_MAX_UPLOAD_SIZE:100MB}
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: "prjxp-mcp"
        version: "1.0.0"

prjxp:
  hub:
    enabled: true
    import-dir: ${PRJXP_ROOT_DIR:.}/.prjxp-data/import
    projects-root: ${PRJXP_ROOT_DIR:.}/.prjxp-data/projects
    live-jsonl-dir: ${PRJXP_ROOT_DIR:.}/.prjxp-data/chunks

  docs:
    # Source directory for the in-app documentation browser (relative to the working dir = repo root in dev).
    dir: mcp-server/doc

  # Embedding Stores
  embedding-stores:
    - project-name: "prjxp"
      default: true

    - project-name: "kigbau"

  embedding:
    type: OLLAMA
    apiBaseURL: http://192.168.188.92:11434
    modelName: mxbai-embed-large
    timeout: 60
    # max texts per embedding HTTP request; the per-project tibedBatchSize is split at this size
    maxSegmentsPerBatch: 32

  embedding-model:
    server-type: "openai"
    provider-url: "${PRJXP_EMBEDDING_API_BASE_URL:http://localhost:1234/v1}"
    model-name: "${PRJXP_EMBEDDING_MODEL_NAME:mxbai-embed-large-v1}"
    api-key: "${EMBEDDING_API_KEY}"
    timeout-secs: 20

  # Chat-Schnittstelle
  chat-models:
    - stereo-type: "default"
      server-type: "lm-studio"
      model-name: "qwen3.8-27B"
      api-key: "lm-studio"
      provider-url: "http://localhost:1234/v1"
      # Lokales 27B-Modell: Doc-Generierung (FAQ, Architektur, ...) dauert >60s.
      # Default wäre 60s -> Timeout. Über PRJXP_CHAT_TIMEOUT_SECS anpassbar.
      timeout-secs: ${PRJXP_CHAT_TIMEOUT_SECS:300}

  graph:
    rerank:
      # Phase-05 E2E calibration on the prjxp corpus: weights are degree-centrality
      # values normalized by the max degree of the whole edge set (external hub types
      # like java.util.List dominate it), so the observed range is 0..0.145 (p99 0.026).
      # With floor=0.8 nearly every code chunk is demoted by ~20 % and semantically
      # weaker doc chunks win even for code-specific queries. 0.98 keeps code on top
      # while still damping peripheral nodes (measured: mean rank shift ~7 positions).
      floor: 0.98
      b-graph: 5.0
      cap: 5.0
      w-base: 1.0

server:
  port: ${SERVER_PORT:7007}
  forward-headers-strategy: framework
  tomcat:
    connection-linger: -1