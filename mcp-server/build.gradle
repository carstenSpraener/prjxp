import com.github.jengelman.gradle.plugins.shadow.transformers.PropertiesFileTransformer

plugins {
    id 'application'
    alias(libs.plugins.shadow)
}

dependencies {
    // Interne Module (Retrieval + Runtime)
    implementation project(':golden-retriever')
    implementation project(':prjxp-common')
    // Hub-Registry kompiliert direkt gegen LuceneEmbeddingStore/LucenePxChunkDao
    // (golden-retriever exposes lucene-store only as `implementation` — not visible to mcp-server)
    implementation project(':lucene-store')
    // In-Prozess-Pipeline fuer den Hub-Modus (Phase 01 DockerHub)
    implementation project(':chunk-norris')
    implementation project(':tibed')
    testFixturesImplementation project(':prjxp-common')

    // Spring Boot
    implementation libs.spring.boot.starter.json
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.openapi.starter.webmvc.ui
    implementation libs.bundles.spring.ai

    // LangChain4j (Inklusive Gemini über das Bundle)
    implementation libs.bundles.langchain.stack

    // Utilities
    implementation libs.commons.cli
    implementation libs.javaparser.core
    implementation libs.dotenv.java
    implementation libs.commons.compress

    // Testing
    testImplementation libs.bundles.test.bundle
}
test {
    // Phase 01 (DockerHub): chunk-norris/tibed sind jetzt auf der Classpath — ihre CLI-Runner
    // duerfen in Hub-Tests nicht feuern (matchIfMissing=true wuerde sie sonst starten lassen).
    systemProperty 'prjxp.cli.enabled', 'false'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'de.spraener.prjxp.mcp.McpServer'
        )
    }
}

application {
    mainClass = 'de.spraener.prjxp.mcp.McpServer'
}

shadowJar {
    zip64 = true
    archiveBaseName.set('mcp-server')
    archiveVersion.set('')
    archiveClassifier.set('all')
    manifest {
        attributes('Multi-Release': 'true')
    }
    exclude 'application.yaml'
    exclude 'application.yml'   // tibed's own config must not leak into the hub fat JAR
    // DevTools nur fuer die lokale Entwicklung — darf nicht ins Fat-JAR (sonst Exit-Code 0 bei Fehlern)
    dependencies {
        exclude(dependency('org.springframework.boot:spring-boot-devtools'))
    }

    // WICHTIG: Diese Transformer mergen die Spring-Konfigurationen
    mergeServiceFiles()
    append 'META-INF/spring.handlers'
    append 'META-INF/spring.schemas'
    append 'META-INF/spring.tooling'
    append 'META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports'
    append 'META-INF/spring/org.springframework.boot.actuate.autoconfigure.web.ManagementContextConfiguration.imports'

    transform(PropertiesFileTransformer) {
        paths = ['META-INF/spring.factories']
        mergeStrategy = 'append'
    }
}
