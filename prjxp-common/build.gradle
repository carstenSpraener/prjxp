plugins {
    id 'maven-publish'
}

dependencies {
    implementation libs.spring.boot.starter
    implementation libs.bundles.langchain.stack

    implementation libs.dotenv.java
    implementation libs.commons.cli
    implementation libs.langchain4j.mcp
    implementation libs.langchain4j.http.client.jdk

    // Groovy for dynamic tool scripting (Phase 01: MCP Tool Support)
    implementation libs.groovy

    testImplementation libs.bundles.test.bundle
    testFixturesImplementation libs.bundles.test.bundle
}

// Publishes prjxp-common to the local Maven repository so that standalone
// Language Pack plugins (e.g. lp-csharp) can consume the shared contract
// (LanguagePack, LanguagePackProvider, PxChunker, PxChunk, GoldenRetriever)
// as a regular Maven artifact instead of a composite build.
//
// The contract closure is self-contained (prjxp-common types + JDK), so a
// consumer only needs this jar to compile against the plugin API.
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

test {
    useJUnitPlatform()
}
