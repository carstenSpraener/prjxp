prjxp:
  hub:
    enabled: true

  # Embedding model type: ollama or open_ai
  embeddingStoreLucene:
    indexPath: ${LUCENE_INDEX_PATH:.prjxp-data/lucene-index}
    vectorDimension: ${LUCENE_VECTOR_DIMENSION:1024}
    name: lucene

#  mcp-servers:
#    - name: "filesystem-mcp"
#      type: "stdio"
#      command: "npx"
#      args: ["-y", "@modelcontextprotocol/server-filesystem", "/Users/casi/Projekte"]

#  chatModels:
#    - stereoType: "coder"
#      serverType: "OPEN_AI"
#      modelName: "gpt-4o-mini"
#      # Native function calling (tool calls via the provider API) is used automatically.
#      # The chat falls back to the text-based TOOL_CALL protocol when the provider rejects tools.
#      # Set this to false to force the text protocol right away (e.g. for small local models):
#      # supportsTools: false

  embedding:
    type: "OPEN_AI"
    apiBaseURL: ${PRJXP_EMBEDDING_API_BASE_URL:http://localhost:1234/v1}
    modelName: ${PRJXP_EMBEDDING_MODEL_NAME:mxbai-embed-large-v1}
    timeout: 20
    apiKey: ${EMBEDDING_API_KEY}

  embeddingStores:
    - projectName: cwd
      isDefault: true

mcp:
  cors:
    allowed-patterns: "http://10.*.*.*,http://172.16.*.*,http://192.168.*.*,http://localhost:*"

server:
  port: ${SERVER_PORT:7007}
  forward-headers-strategy: framework
  tomcat:
    connection-linger: -1

spring:
  main:
    allow-bean-definition-overriding: true
  devtools:
    restart:
      additional-exclude: "**/package-info.java"
