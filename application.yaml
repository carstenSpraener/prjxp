prjxp:
  hub:
    enabled: true

  # Embedding model type: ollama or open_ai
  embeddingStoreLucene:
    indexPath: ${LUCENE_INDEX_PATH:.prjxp-data/lucene-index}
    vectorDimension: ${LUCENE_VECTOR_DIMENSION:1024}
    name: lucene

  chatModels:
    - stereotype: detailed
      serverType: lm-studio
      providerUrl: http://host.docker.internal:1234/v1
      modelName: qwen3.8-27b-splash
      timeoutSecs: 240
      apiKey: ${EMBEDDING_API_KEY}

    - stereotype: documentation
      serverType: lm-studio
      providerUrl: http://host.docker.internal:1234/v1
      modelName: qwen3.8-27b-splash
      timeoutSecs: 240
      apiKey: ${EMBEDDING_API_KEY}
      # Qwen3: thinking mode breaks tool-calling (the call leaks into content as XML).
      # DocPipe relies on native function calling, so disable thinking for this stereotype.
      bodyProperties:
        enable_thinking: false

    - stereotype: javadoc
      serverType: lm-studio
      providerUrl: http://host.docker.internal:1234/v1
      modelName: qwen3.8-27b-splash
      timeoutSecs: 240
      apiKey: ${EMBEDDING_API_KEY}
      # Same Qwen3 thinking-mode issue as above (DocPipe javadoc generation).
      bodyProperties:
        enable_thinking: false

  mcp-servers:
    - name: prjxp
      type: http
      url: ${PRJXP_HUB_URL:http://localhost:7007/mcp}

  embedding:
    type: "OPEN_AI"
    apiBaseURL: ${PRJXP_EMBEDDING_API_BASE_URL:http://localhost:1234/v1}
    modelName: ${PRJXP_EMBEDDING_MODEL_NAME:mxbai-embed-large-v1}
    timeout: 20
    apiKey: ${EMBEDDING_API_KEY}

  embeddingStores:
    - projectName: cwd
      isDefault: true

mcp:
  cors:
    allowed-patterns: "http://10.*.*.*,http://172.16.*.*,http://192.168.*.*,http://localhost:*"

server:
  port: ${SERVER_PORT:7007}
  forward-headers-strategy: framework
  tomcat:
    connection-linger: -1

spring:
  main:
    allow-bean-definition-overriding: true
  devtools:
    restart:
      additional-exclude: "**/package-info.java"
