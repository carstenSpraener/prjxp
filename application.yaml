prjxp:
  # which project to work on if none is on command line.
  activeProject: "prjxp"

  projects:
    - name: "prjxp"
      rootDir: "."
      jsonlFile: "prjxp-src.jsonl"
      chunoWhiteList: "java"
      tibedBatchSive: 50
      tibedResetStore: true

  # Use Ollama on SteamDeck for Embedding
  embeddingOllamaUrl: http://192.168.188.114:11434
  embeddingModelName: mxbai-embed-large
  embeddingTimeoutSecs: 60

  embeddingStores:
    - projectName: prjxp
      providerUrl: http://localhost:8000
      tenant: prjxp
      dbName: prjxp
      collectionName: prjxp-src
      isDefault: true

  chatModels:
    - stereotype: detailed
      serverType: ollama
      modelName: gpt-oss-120B
      providerUrl: http://localhost:11434

    - stereoType: expert
      serverType: gemini
      modelName: gemini-3-flash
      apiKey: ${GOOGLE_API_KEY}

    - stereoType: embedding
      serverType: ollama
      providerUrl: http://192.168.188.114:11434
      modelName: mxbai-embed-large
      timeoutSecs: 60