import com.github.jengelman.gradle.plugins.shadow.transformers.PropertiesFileTransformer

plugins {
    id 'application'
    alias(libs.plugins.shadow)
}

dependencies {
    // CLI-Argument-Parsing
    implementation libs.commons.cli

    // Jackson nur fuer JSON-Validierung (keine Spring-Boot-Starter)
    implementation libs.jackson.core
    implementation libs.jackson.databind

    // SLF4J API for Lombok @Slf4j
    implementation libs.slf4j.api

    // Test-Abhaengigkeiten werden zentral im root build.gradle fuer mcp-proxy verwaltet
}

jar {
    manifest {
        attributes(
                'Main-Class': 'de.spraener.prjxp.mcpproxy.McpProxy'
        )
    }
}

application {
    mainClass = 'de.spraener.prjxp.mcpproxy.McpProxy'
}

shadowJar {
    // Shadow 9 defaults to EXCLUDE, which drops duplicates before transformers
    // see them. Keep first-wins for regular entries, but let the resource
    // transformers merge service/Spring metadata files.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching([
            'META-INF/services/**',
            'META-INF/*.kotlin_module',
            'META-INF/spring.factories',
            'META-INF/spring.handlers',
            'META-INF/spring.schemas',
            'META-INF/spring.tooling'
    ]) {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    zip64 = true
    archiveBaseName.set('mcp-proxy')
    archiveVersion.set('')
    archiveClassifier.set('all')
    manifest {
        attributes('Multi-Release': 'true')
    }

    mergeServiceFiles()
    append 'META-INF/spring.handlers'
    append 'META-INF/spring.schemas'
    append 'META-INF/spring.tooling'

    transform(PropertiesFileTransformer) {
        paths = ['META-INF/spring.factories']
        mergeStrategy = PropertiesFileTransformer.MergeStrategy.Append
    }
}
