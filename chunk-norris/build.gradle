import com.github.jengelman.gradle.plugins.shadow.transformers.PropertiesFileTransformer

/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */
plugins {
    id 'application'
    alias(libs.plugins.shadow)
}

dependencies {
    implementation project(':prjxp-common')
    testFixturesImplementation project(':prjxp-common')
    // WP-1 Phase 02: PluginJarBuilder + plugin fixtures for the bootstrap tests
    testImplementation testFixtures(project(':prjxp-common'))

    // Spring & DevTools
    implementation libs.spring.boot.starter.json
    implementation libs.bundles.langchain.stack

    implementation libs.bundles.langchain.docparser
    implementation libs.groovy

    // Security-Pin (SecurityFindings.csv): JLine wird transitiv via Groovy gezogen
    implementation libs.jline.reader
    implementation libs.jline.builtins

    implementation libs.jgrapht
    implementation libs.bundles.conversion

    developmentOnly libs.spring.boot.devtools
    // Tools
    implementation libs.commons.cli
    implementation libs.javaparser.core
    implementation libs.dotenv.java
    implementation libs.commons.io

}

// ---------------------------------------------------------------------------
// C# Language Pack E2E (WP-2 Phase 04): stage the lp-csharp plugin fat JAR
// (built by the root-level :buildLpCsharpPlugin task) so the host tests can
// load it via prjxp.language-packs.dir.
// ---------------------------------------------------------------------------
def lpCsharpJar = new File(rootProject.projectDir, 'lp-csharp/build/libs/lp-csharp-plugin.jar')
def lpCsharpStageDir = layout.buildDirectory.dir('language-packs')

tasks.register('stageLpCsharpPlugin', Copy) {
    dependsOn ':buildLpCsharpPlugin'
    from lpCsharpJar
    into lpCsharpStageDir
}

test {
    // WP-2 Phase 04: the C# E2E test loads the staged lp-csharp plugin JAR
    // (the property is only consumed by that test, via @DynamicPropertySource).
    dependsOn 'stageLpCsharpPlugin'
    systemProperty 'prjxp.csharp.e2e.pluginDir', lpCsharpStageDir.get().asFile.absolutePath
}

jar {
    manifest {
        attributes(
                'Main-Class': 'de.spraener.prjxp.chuno.ChunkNorris' // Pfad zu deiner Main-Klasse
        )
    }
}

application {
    // Define the main class for the application.
    mainClass = 'de.spraener.prjxp.chuno.ChunkNorris'
}

shadowJar {
    archiveBaseName.set('chunk-norris')
    archiveVersion.set('')
    zip64=true
    manifest {
        attributes('Multi-Release': 'true')
    }
    exclude 'application.yaml'
    // DevTools nur fuer die lokale Entwicklung — darf nicht ins Fat-JAR (sonst Exit-Code 0 bei Fehlern)
    dependencies {
        exclude(dependency('org.springframework.boot:spring-boot-devtools'))
    }

    // WICHTIG: Diese Transformer mergen die Spring-Konfigurationen
    mergeServiceFiles()
    append 'META-INF/spring.handlers'
    append 'META-INF/spring.schemas'
    append 'META-INF/spring.tooling'
    append 'META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports'
    append 'META-INF/spring/org.springframework.boot.actuate.autoconfigure.web.ManagementContextConfiguration.imports'

    transform(PropertiesFileTransformer) {
        paths = ['META-INF/spring.factories']
        mergeStrategy = 'append'
    }
}