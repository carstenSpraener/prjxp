<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Glow (Active) -->
  <rect x="8" y="12" width="48" height="40" rx="8" stroke="#00f5ff" stroke-width="2" filter="url(#glow)" class="icon-glow"/>
  <!-- Base Shape: Open Box -->
  <path d="M12 36 L24 24 L52 24 L60 36" stroke="#161b22" stroke-width="4" fill="none"/>
  <path d="M12 36 L8 44 L56 44 L60 36" stroke="#161b22" stroke-width="4" fill="none"/>
  <!-- Arrow -->
  <path d="M32 40 L32 20" stroke="#00f5ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M24 28 L32 20 L40 28" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Filter Definition -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
