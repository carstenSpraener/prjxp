<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Network Mesh Pattern (subtle, low contrast) -->
    <pattern id="network-mesh" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Nodes (very subtle) -->
      <circle cx="10" cy="20" r="1.5" fill="#30363d" opacity="0.4"/>
      <circle cx="40" cy="10" r="1.5" fill="#30363d" opacity="0.4"/>
      <circle cx="70" cy="40" r="1.5" fill="#30363d" opacity="0.4"/>
      <circle cx="85" cy="70" r="1.5" fill="#30363d" opacity="0.4"/>
      <circle cx="60" cy="90" r="1.5" fill="#30363d" opacity="0.4"/>
      <circle cx="20" cy="80" r="1.5" fill="#30363d" opacity="0.4"/>
      <!-- Connections (very subtle) -->
      <path d="M10 20 L40 10" stroke="#30363d" stroke-width="0.8" opacity="0.2"/>
      <path d="M40 10 L70 40" stroke="#30363d" stroke-width="0.8" opacity="0.2"/>
      <path d="M70 40 L85 70" stroke="#30363d" stroke-width="0.8" opacity="0.2"/>
      <path d="M85 70 L60 90" stroke="#30363d" stroke-width="0.8" opacity="0.2"/>
      <path d="M60 90 L20 80" stroke="#30363d" stroke-width="0.8" opacity="0.2"/>
      <path d="M20 80 L10 20" stroke="#30363d" stroke-width="0.8" opacity="0.2"/>
      <!-- Faint "px" Logos -->
      <text x="25" y="60" font-family="JetBrains Mono, monospace" font-size="12" fill="#30363d" opacity="0.3">px</text>
    </pattern>
  </defs>
  
  <!-- Base Dark Background -->
  <rect width="400" height="400" fill="#161b22"/>
  
  <!-- Apply Pattern -->
  <rect width="400" height="400" fill="url(#network-mesh)"/>
</svg>