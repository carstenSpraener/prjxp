<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Glow (Active) -->
  <circle cx="32" cy="32" r="28" stroke="#00f5ff" stroke-width="2" filter="url(#glow)" class="icon-glow"/>
  <!-- Base Shape -->
  <circle cx="32" cy="32" r="28" stroke="#161b22" stroke-width="4"/>
  <!-- Gauge Details -->
  <path d="M32 16 A16 16 0 0 1 48 32" stroke="#00f5ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 16 L32 32" stroke="#00f5ff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="4" fill="#00f5ff"/>
  <!-- Filter Definition -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
