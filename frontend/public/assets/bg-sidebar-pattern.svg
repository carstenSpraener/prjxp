<svg xmlns="http://www.w3.org/2000/svg" width="100" height="400" viewBox="0 0 100 400">
  <defs>
    <!-- Vertical Lines Pattern -->
    <pattern id="vertical-lines" width="10" height="400" patternUnits="userSpaceOnUse">
      <rect width="10" height="400" fill="#161b22"/>
      <line x1="5" y1="0" x2="5" y2="400" stroke="#30363d" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Base Dark Background -->
  <rect width="100" height="400" fill="#161b22"/>
  
  <!-- Apply Pattern -->
  <rect width="100" height="400" fill="url(#vertical-lines)"/>
</svg>
