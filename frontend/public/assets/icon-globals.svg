<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Glow (Active) -->
  <circle cx="32" cy="32" r="28" stroke="#00f5ff" stroke-width="2" filter="url(#glow)" class="icon-glow"/>
  <!-- Base Shape -->
  <circle cx="32" cy="32" r="28" stroke="#161b22" stroke-width="4"/>
  <!-- Gear Teeth -->
  <path d="M32 8 L32 14 M32 50 L32 56 M8 32 L14 32 M50 32 L56 32" stroke="#00f5ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M15.5 15.5 L19.7 19.7 M44.3 44.3 L48.5 48.5 M48.5 15.5 L44.3 19.7 M19.7 44.3 L15.5 48.5" stroke="#00f5ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Gear Center -->
  <circle cx="32" cy="32" r="10" stroke="#00f5ff" stroke-width="3"/>
  <circle cx="32" cy="32" r="4" fill="#00f5ff"/>
  <!-- Filter Definition -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
