name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 # Oder deine genutzte Java-Version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Creating the GitHub Release requires write access to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build All
        # shadowJar builds the app fat-JARs; buildLpCsharpPlugin builds the
        # standalone C# language-pack plugin (published to mavenLocal first).
        run: ./gradlew shadowJar buildLpCsharpPlugin
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mcp-server/build/libs/*-all.jar
            chunk-norris/build/libs/*-all.jar
            tibed/build/libs/*-all.jar
            docpipe/build/libs/*-all.jar
            mcp-proxy/build/libs/*-all.jar
            lp-csharp/build/libs/lp-csharp-plugin.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
